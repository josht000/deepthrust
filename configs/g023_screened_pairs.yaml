# G023 ADF+Hurst+Half-Life screened pair reversion, Bollinger-distance entry.
# Legs rebased to 100 over the 200d band window; short the leg near the upper
# band while partner is below the pair-average mid; TP at mid, stop at the
# outer band, monthly screen re-verify (corr_keep). One pair at a time.
# DELTA vs source: normalized legs = window-rebase x100 (source used a global
# normalized CSV); half-life uses the OLS slope (source used the intercept);
# monthly re-verification added (source screened once on full history).
data_dir: C:\data\trading\trading_framework\data\cache\etf_tr
data_suffix: .parquet
symbols: SPY,IVV,VOO,QQQ,IWM,DIA,RSP,TLT,IEF,SHY,BIL,AGG,TIP,GLD,SLV,CPER,GDX,GDXJ,USO,DBC,GSG,EEM,EFA,EWJ,HYG,LQD,IYR,VNQ,XLE,XLB,XLI,XLK,UUP
pairs: ""
benchmark: SPY
start_date: "2008-01-01"
formation_window: 252
adf_max_p: 0.01
adf_lags: 1
hurst_max_horizon: 64
hurst_lt: 0.5
max_half_life: 30
corr_min: 0.75
corr_keep: 0.9
bb_len: 200
bb_mult: 2.0
pair_dist: 2.0
entry_mode: band
norm_mode: rebase
borrow_bps_annual: 50.0
cost_bps_per_side: 1.0
fills: next_open,close
partition_split_date: "2024-01-01"
n_draws: 1000
