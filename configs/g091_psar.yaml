# G091 Parabolic SAR stop-and-reverse (Wilder AF 0.02 -> 0.2).
# Long-only port of the catalog's long/short spec (engine has no short leg).
data_dir: C:\data\trading\trading_framework\data\cache\etf_tr
data_suffix: .parquet
symbols: SPY,QQQ,IWM,DIA,XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY
benchmark: SPY
start_date: "2005-01-01"
min_history: 250
sar_step: 0.02
sar_max: 0.2
disaster_stop_atr: 0.0
cost_bps_per_side: 5.0
fills: next_open,close
partition_split_date: "2024-01-01"
n_draws: 1000
n_boot: 5000
n_timing_draws: 500
seed: 20261101
book_slots: 15

variants:
  step01: {sar_step: 0.01}
  step03: {sar_step: 0.03}
  step04: {sar_step: 0.04}
  max15: {sar_max: 0.15}
  max25: {sar_max: 0.25}
  max30: {sar_max: 0.3}
  slow: {sar_step: 0.01, sar_max: 0.15}
  fast: {sar_step: 0.04, sar_max: 0.25}
  tighter: {sar_step: 0.03, sar_max: 0.15}
  spy_only: {symbols: SPY, book_slots: 1}
  qqq_only: {symbols: QQQ, book_slots: 1}
  tlt_only: {symbols: TLT, book_slots: 1}
  gld_only: {symbols: GLD, book_slots: 1}
  uso_only: {symbols: USO, book_slots: 1}
