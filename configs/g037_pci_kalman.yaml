# G037 Clegg-Krauss partial cointegration: residual e = logA-alpha-beta*logB
# decomposes as AR(1) M + random-walk R. Trade only pairs where PAR wins the
# AIC comparison vs AR(1) and RW with 0.5<rho<0.8, R2>0.5, 0.75<beta<1.25.
# Kalman M drives entries at +/-1 sigma_M, exits at -/+0.5 sigma_M.
# DELTA vs source: params fit by Kalman log-likelihood over a
# (rho x sigma_R/sigma_M) grid rather than numeric MLE; beta on log prices.
