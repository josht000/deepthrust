# G097 Baltas-style vol-scaled trend: sign(12m momentum) x min(0.95, 0.4/vol21)
# per asset, month-end rebalance. DELTA: private Baltas signal -> TSMOM sign;
# futures -> TR ETF book. strategy_mode selects vol estimator: rolling|ewm|yz.
data_dir: C:\data\trading\trading_framework\data\cache\etf_tr
data_suffix: .parquet
symbols: SPY,QQQ,IWM,DIA,XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY,GLD,TLT,IEF,DBC,UUP
benchmark: SPY
start_date: "2005-01-01"
min_history: 280
mom_window: 252
vol_window: 21
target_vol: 0.4
pos_cap: 0.95
max_leverage: 4.0
strategy_mode: rolling
rebalance: monthly
cost_bps_per_side: 5.0
fills: next_open,close
partition_split_date: "2024-01-01"
n_draws: 1000
n_boot: 5000
seed: 20261101
book_slots: 20

variants:
  ewm: {strategy_mode: ewm}
  yz: {strategy_mode: yz}
  mom126: {mom_window: 126}
  mom189: {mom_window: 189}
  mom63: {mom_window: 63}
  vol10: {vol_window: 10}
  vol42: {vol_window: 42}
  vol63: {vol_window: 63}
  tv20: {target_vol: 0.2}
  tv30: {target_vol: 0.3}
  tv50: {target_vol: 0.5}
  cap50: {pos_cap: 0.5}
  cap100: {pos_cap: 1.0}
  weekly: {rebalance: weekly}
  yz_mom126: {strategy_mode: yz, mom_window: 126}
