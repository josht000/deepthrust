  mixed8: {symbols: "SPY,QQQ,TLT,GLD,DBC,EEM,IEF,UUP", book_slots: 8}
  sectors_w20: {symbols: "XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY", book_slots: 11, lookback: 20}
  sectors_weekly: {symbols: "XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY", book_slots: 11, rebalance: weekly}
  cost10: {cost_bps_per_side: 10.0}
