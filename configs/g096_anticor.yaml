  sectors: {symbols: "XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY", book_slots: 11}
  equity: {symbols: "SPY,QQQ,IWM,DIA,EFA,EEM,RSP,EWJ", book_slots: 8}
