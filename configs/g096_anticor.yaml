# G096 ANTICOR: daily wealth transfer via cross-autocorrelation between each
# stock's recent w-day return block and other stocks' prior w-day block.
data_dir: C:\data\trading\trading_framework\data\cache\etf_tr
data_suffix: .parquet
symbols: SPY,QQQ,IWM,DIA,XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY,GLD,TLT,IEF,DBC,UUP
benchmark: SPY
start_date: "2005-01-01"
min_history: 70
lookback: 30
rebalance: daily
cost_bps_per_side: 5.0
fills: next_open,close
partition_split_date: "2024-01-01"
n_draws: 1000
n_boot: 5000
seed: 20261101
book_slots: 20

variants:
