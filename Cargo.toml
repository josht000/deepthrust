[package]
name = "deepthrust"
version = "0.1.0"
edition = "2021"
description = "Deep market alpha penetration testing in Rust (port of trading_framework strategy S001)"
license = "GPL-3.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
parquet = { version = "60", default-features = false, features = ["snap"] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "full_palette"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
